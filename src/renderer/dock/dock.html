<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    user-select: none;
    cursor: default;
    /* max-content <-> 고정폭 사이의 width 전환을 허용 (알림 해소 시 부드럽게 줄어들도록) */
    interpolate-size: allow-keywords;
  }
  /* 컨트롤 패널: 맨 위에 상시 노출. 접혀 있으면 [<] 버튼과 세션 사용량 %만
     보이고, 누르면 왼쪽으로 튀어나오며 전체 펼침 + 투명도 슬라이더 +
     사용량 게이지가 나타난다. 카드처럼 오른쪽 11px를 화면 밖에 묻어
     바운스 때 온전한 모서리가 드러난다 (접힘 폭 26 = 168 - 131 - 11) */
  #ctrl {
    position: absolute;
    top: 14px;
    right: -11px;
    width: 168px;
    box-sizing: border-box;
    display: flex;
    align-items: stretch;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.88);
    border: 1px solid rgba(0, 0, 0, 0.2);
    transform: translateX(131px);
    transition: transform 0.22s ease;
    z-index: 5;
  }
  #ctrl.out {
    transform: translateX(0);
  }
  /* 사용량 계단 돌파 알림: 패널도 카드와 같은 문법으로 바운스한다.
     반드시 .out과 함께 걸어야 한다. 바운스 keyframes가 transform을 점유하므로
     .out만 빠지고 .boing이 남으면 접기를 눌러도 패널이 펼쳐진 채 버티다가
     애니메이션이 끝나는 순간 뚝 끊기며 들어간다 (2026-09 접기 버그 원인 1) */
  #ctrl.out.boing {
    transform-origin: right center;
    animation: boing 3s 2;
  }
  #toggle {
    flex: 0 0 26px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    font-size: 14px;
    color: rgba(0, 0, 0, 0.55);
    border-right: 1px solid rgba(0, 0, 0, 0.08);
    border-radius: 10px 0 0 10px;
    cursor: pointer;
  }
  /* 접혀 있어도 보이는 사용량 %. Claude 세션 %와 Codex 첫 한도 %를 위아래로
     쌓는다 (Codex 줄은 카드처럼 왼쪽이 둥근 알약 테두리로 구분) */
  #tPct {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
    font-size: 7.5px;
    line-height: 1.2;
    color: rgba(0, 0, 0, 0.5);
  }
  #tPct:empty {
    display: none;
  }
  #tPct .claude,
  #tPct .model {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  #tPct .model {
    margin-top: 2px;
  }
  #tPct .codex {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 2px;
    border: 1px solid rgba(0, 0, 0, 0.25);
    border-radius: 6px 3px 3px 6px;
  }
  /* 접힌 띠의 항목 이름(5h, Fable)과 리셋까지 남은 시간 (예: 2h10m, 1d15h) */
  #tPct .tLab,
  #tPct .tLeft {
    font-size: 6.5px;
    color: rgba(0, 0, 0, 0.4);
    letter-spacing: -0.2px;
    max-width: 24px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #tPct .tLab {
    color: rgba(0, 0, 0, 0.3);
  }
  /* 오래된 값(마지막 갱신 2시간 이상 전이거나 저장본): 흐리게 */
  #tPct .old,
  .uRow.old,
  .uReset.old {
    opacity: 0.55;
  }
  /* 두 에이전트의 게이지가 함께 있을 때만 붙는 구분 제목 */
  .uHead {
    font-size: 7.5px;
    color: rgba(0, 0, 0, 0.4);
    margin-top: 2px;
  }
  .uHead:first-child {
    margin-top: 0;
  }
  #ctrl.usageWarn #tPct {
    color: #c03020;
  }
  #toggle:hover {
    background: rgba(0, 0, 0, 0.06);
    color: #000;
  }
  #ctrl.out #toggle {
    color: #0a60c2;
  }
  #ctrlBody {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 8px;
    /* 오른쪽 여백은 화면 밖 묻힘 11px을 더해 잡는다 */
    padding: 9px 22px 9px 12px;
  }
  /* 플랜 사용량 게이지: 패널을 펼치면 슬라이더 아래에 보인다.
     조회 실패(비공식 API 변경 등) 시에는 행이 사라진다 */
  #usage {
    display: none;
    flex-direction: column;
    gap: 5px;
  }
  #usage.on {
    display: flex;
  }
  .uRow {
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .uLabel {
    flex: 0 0 30px;
    font-size: 8.5px;
    color: rgba(0, 0, 0, 0.55);
    white-space: nowrap;
    overflow: hidden;
  }
  .uBar {
    flex: 1;
    height: 3px;
    border-radius: 2px;
    background: rgba(0, 0, 0, 0.15);
    overflow: hidden;
  }
  .uFill {
    height: 100%;
    border-radius: 2px;
    background: #0a60c2;
    transition: width 0.4s ease;
  }
  .uRow.warn .uFill {
    background: #c87814;
  }
  .uRow.crit .uFill {
    background: #c03020;
  }
  .uPct {
    flex: 0 0 26px;
    text-align: right;
    font-size: 8.5px;
    color: rgba(0, 0, 0, 0.6);
  }
  /* 행 아래 줄: 왼쪽에 리셋 날짜와 시각, 오른쪽에 남은 시간. 툴팁이 아니라
     늘 보인다. 한 줄에 다 안 들어가면 날짜 쪽만 말줄임된다 */
  .uReset {
    display: flex;
    justify-content: space-between;
    gap: 4px;
    margin-top: -3px;
    font-size: 7.5px;
    line-height: 1.2;
    color: rgba(0, 0, 0, 0.45);
    white-space: nowrap;
  }
  .uReset .when {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .uReset .left {
    flex: 0 0 auto;
  }
  .uReset:empty {
    display: none;
  }
  .uRow.crit + .uReset {
    color: #c03020;
  }
  /* 사용량이 임계(80%)를 넘으면 접힌 상태의 토글 색으로도 알 수 있다 */
  #ctrl.usageWarn #toggle {
    color: #c03020;
  }
  /* 투명도 슬라이더: 얇은 트랙과 작은 막대형 손잡이 */
  #op {
    -webkit-appearance: none;
    flex: 1;
    min-width: 0;
    height: 3px;
    border-radius: 2px;
    background: rgba(0, 0, 0, 0.22);
    outline: none;
  }
  #op::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 5px;
    height: 13px;
    border-radius: 3px;
    background: #0a60c2;
  }
  /* 카드: 각자 저장된 세로 위치(top)에 자유 배치된다. 평소에는 오른쪽으로
     밀려 들어가 왼쪽 가장자리 22px 띠만 보이고, hover / 전체 펼침 / 알림 시
     왼쪽으로 튀어나온다. 폭은 내용 길이에 맞추므로 밀어넣는 거리는 JS가
     카드별로 측정해 --peek-x 변수로 넣는다. top 변화는 부드럽게 움직여서
     겹침 해소로 밀려나는 모습이 자연스럽다.
     카드는 4방 테두리와 둥근 모서리를 가진 완성형이고, 평소에는 오른쪽
     11px(모서리 반경 + 테두리)를 화면 밖에 묻어 도크에 붙은 모양을 낸다.
     바운스로 뛰어오르면 잘린 면이 아니라 온전한 오른쪽 모서리가 드러난다.
     불변식 1: 접혔을 때 보이는 폭(22px) <= 테두리(1px) + 왼쪽 여백(26px).
     글자는 여백 안으로 들어올 수 없으므로, 접힌 띠에 글자 조각이
     보이는 일이 구조적으로 없다. 보이는 폭을 키우면 여백도 같이 키울 것.
     불변식 2: JS의 접힘 거리 계산(offsetWidth - 33)은 보이는 폭 22px과
     오른쪽 묻힘 11px의 합과 일치해야 한다 */
  .card {
    position: absolute;
    right: -11px;
    width: max-content;
    min-width: 72px;
    max-width: 248px;
    box-sizing: border-box;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.88);
    border: 1px solid rgba(0, 0, 0, 0.2);
    color: #1c1c1e;
    padding: 13px 24px 13px 26px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: 28px;
    transform: translateX(var(--peek-x, 39px));
    transition: top 0.25s ease, transform 0.22s ease, background 0.25s, border-color 0.25s,
      width 0.25s ease;
  }
  /* 알림 카드는 메시지가 보이도록 최대 폭으로 고정 */
  .card.alert {
    width: 248px;
  }
  /* Codex 세션 카드: 왼쪽이 둥근 알약(타원) 모양으로 Claude 카드(둥근
     사각형)와 구분한다. 접혀 있을 때 보이는 22px 띠도 Codex는 둥근 끝,
     Claude는 직선이라 접힌 채로도 어느 쪽인지 알 수 있다.
     왼쪽 여백을 곡면만큼 더 줘서(불변식 1) 글자가 곡면에 걸리지 않게 한다.
     오른쪽 모서리는 그대로라 화면 밖 묻힘 11px 규칙(불변식 2)이 유지된다 */
  .card.codex {
    border-radius: 22px 10px 10px 22px;
    padding-left: 32px;
  }
  .card.codex.working::before {
    border-radius: 21px 9px 9px 21px;
  }
  /* 스피너는 곡면 안쪽 중앙에 오도록 살짝 안으로 */
  .card.codex .spin {
    left: 8px;
  }
  .card.out {
    transform: translateX(0);
  }
  /* 드래그 중인 카드는 애니메이션 없이 커서를 그대로 따라간다 */
  .card.dragging {
    transition: background 0.25s, border-color 0.25s;
    opacity: 0.9 !important;
    border-color: rgba(0, 0, 0, 0.5);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    z-index: 10;
  }
  .name {
    font-size: 12px;
    font-weight: 600;
    line-height: 1.3;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  /* 알림 내용은 display 토글 대신 max-height 전환으로 나타나고 사라져서,
     알림이 뜨고 닫힐 때 카드 높이가 부드럽게 늘고 준다.
     전환 시간(0.25s)을 바꾸면 JS의 SETTLE_MS도 같이 볼 것 */
  .msg,
  .desc {
    overflow: hidden;
    max-height: 0;
    margin-top: 0;
    opacity: 0;
    transition: max-height 0.25s ease, margin-top 0.25s ease, opacity 0.2s ease;
  }
  .msg {
    display: -webkit-box;
    font-size: 10px;
    line-height: 1.35;
    color: #5a3c00;
    word-break: break-all;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
  }
  .desc {
    font-size: 9.5px;
    line-height: 1.3;
    color: rgba(90, 60, 0, 0.65);
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .err {
    font-size: 10px;
    color: #a33000;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 5px;
  }
  .err:empty {
    display: none;
  }
  .card.alert {
    background: rgba(255, 216, 140, 0.94);
    border-color: rgba(200, 130, 20, 0.8);
  }
  .card.alert .msg {
    max-height: 28px;
    margin-top: 5px;
    opacity: 1;
  }
  .card.alert .desc {
    max-height: 13px;
    margin-top: 4px;
    opacity: 1;
  }
  .card.alert .desc:empty {
    max-height: 0;
    margin-top: 0;
  }
  .card.input {
    background: rgba(190, 220, 255, 0.94);
    border-color: rgba(40, 100, 190, 0.7);
  }
  .card.input .msg {
    color: #123c6e;
  }
  /* 작업 완료 알림: 초록색 계열. 다음 요청을 보내면 된다는 신호 */
  .card.done {
    background: rgba(198, 236, 198, 0.94);
    border-color: rgba(45, 140, 70, 0.75);
  }
  .card.done .msg {
    color: #1a5c2e;
  }
  .card.done .desc {
    color: rgba(26, 92, 46, 0.65);
  }
  /* 가장 최근 알림 카드: 은은한 글로우로 강조. 전역 단축키의 대상이다 */
  .card.target {
    box-shadow: 0 0 14px rgba(214, 138, 16, 0.6);
  }
  .card.target.input {
    box-shadow: 0 0 14px rgba(40, 100, 190, 0.55);
  }
  .card.target.done {
    box-shadow: 0 0 14px rgba(45, 160, 85, 0.55);
  }
  /* 알림 카드의 도크식 바운스: 오른쪽 가장자리가 땅이고 중력이 그쪽에
     있다는 느낌으로, 왼쪽으로 뛰어올랐다가 떨어지며 착지 때 살짝 눌리고
     잦아든다. 8회 재생 후 멈추고(상시 애니메이션으로 전력을 낭비하지
     않도록), 새 알림이나 1분 재알림 때 bump 값 변화로 다시 재생된다 */
  @keyframes boing {
    0% { transform: translateX(0); animation-timing-function: cubic-bezier(0.2, 0.7, 0.4, 1); }
    8% { transform: translateX(-18px); animation-timing-function: cubic-bezier(0.55, 0, 0.85, 0.45); }
    15% { transform: translateX(0) scaleX(0.96); animation-timing-function: cubic-bezier(0.2, 0.7, 0.4, 1); }
    21% { transform: translateX(-8px); animation-timing-function: cubic-bezier(0.55, 0, 0.85, 0.45); }
    26% { transform: translateX(0) scaleX(0.985); animation-timing-function: cubic-bezier(0.2, 0.7, 0.4, 1); }
    30% { transform: translateX(-3px); animation-timing-function: cubic-bezier(0.55, 0, 0.85, 0.45); }
    34%, 100% { transform: translateX(0); }
  }
  .card.alert:not(.dragging) {
    transform-origin: right center;
    animation: boing 3s 0.4s 8;
  }
  /* hover 중에는 제자리에 일시정지해 클릭 조준을 방해하지 않는다.
     제거가 아니라 정지라서, 카드가 커서 밑으로 뛰어든 순간 스냅백과
     재시작이 반복되는 깜빡임 루프가 생기지 않는다 */
  .card.alert:hover {
    animation-play-state: paused;
  }
  /* 알림만 닫기 버튼: 카드 우상단, 알림 카드에 hover했을 때만 나타난다.
     카드 클릭(창 전환 + 해소)과 달리 창 전환 없이 알림만 해소한다.
     다른 화면을 보던 중 알림을 일단 치우고 생각하고 싶을 때 쓴다.
     오른쪽 11px이 화면 밖에 묻히므로 right는 그만큼 안쪽으로 잡는다 */
  .x {
    position: absolute;
    top: 4px;
    right: 15px;
    width: 16px;
    height: 16px;
    line-height: 16px;
    text-align: center;
    border-radius: 8px;
    font-size: 9px;
    color: rgba(0, 0, 0, 0.55);
    background: rgba(0, 0, 0, 0.08);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s;
  }
  .card.alert:hover .x {
    opacity: 1;
    pointer-events: auto;
  }
  .x:hover {
    background: rgba(0, 0, 0, 0.18);
    color: rgba(0, 0, 0, 0.85);
  }
  /* 상태 2종: 세션은 항상 작업 중이거나 입력 대기다.
     작업 중은 보라색 숨쉬기, 입력 대기(유휴)는 옅은 파란 기운.
     파랑은 내 차례, 보라는 Claude 차례라는 의미로 알림 색과도 이어진다.
     숨쉬기는 배경색 애니메이션 대신 보라 틴트 오버레이(::before)의
     opacity만 움직여 컴포지터에서 처리된다. 배경색을 직접 움직이면 상시
     최상단 창이 턴 내내 매 프레임 리페인트된다 */
  @keyframes breathe {
    0%, 100% { opacity: 0; }
    50% { opacity: 1; }
  }
  .card.working {
    border-color: rgba(112, 80, 220, 0.45);
  }
  .card.working::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 9px;
    background: rgba(219, 208, 255, 0.55);
    opacity: 0;
    animation: breathe 2.4s ease-in-out infinite;
    pointer-events: none;
  }
  /* 글자들을 틴트 오버레이 위 페인트 순서로 올린다 */
  .card .name,
  .card .msg,
  .card .desc,
  .card .err {
    position: relative;
  }
  .card.waiting {
    background: rgba(226, 238, 252, 0.9);
    border-color: rgba(80, 125, 195, 0.4);
  }
  /* 작업 중 스피너: 접혀 있어도 보이는 왼쪽 띠 안에서 돈다.
     steps로 12fps만 그려 상시 프레임 생산을 줄인다 */
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .spin {
    display: none;
    position: absolute;
    left: 6px;
    top: 50%;
    margin-top: -5px;
    width: 10px;
    height: 10px;
    box-sizing: border-box;
    border: 2px solid rgba(112, 80, 220, 0.22);
    border-top-color: rgba(112, 80, 220, 0.85);
    border-radius: 50%;
    animation: spin 1s steps(12, end) infinite;
  }
  .card.working .spin {
    display: block;
  }
</style>
</head>
<body>
  <div id="ctrl">
    <div id="toggle" title="모두 펼치기"><span id="tArrow">‹</span><span id="tPct"></span></div>
    <div id="ctrlBody">
      <input id="op" type="range" min="20" max="100" step="1" value="100" title="투명도">
      <div id="usage"></div>
    </div>
  </div>
<script>
  const ctrl = document.getElementById('ctrl');
  const toggle = document.getElementById('toggle');
  const tArrow = document.getElementById('tArrow');
  const tPct = document.getElementById('tPct');
  const opSlider = document.getElementById('op');
  const usageEl = document.getElementById('usage');
  const cards = new Map();
  const GAP = 6;
  // 상태 변화 후 CSS 전환(0.25s)이 끝나고 나서 재측정하는 시점
  const SETTLE_MS = 320;

  let down = null;
  let drag = null;
  let allOut = false;
  let opacity = 1;
  // 로컬에서 막 바꾼 값이 전송 중이던 옛 상태에 덮이지 않도록 잠시 지키는 시각
  let opTouchedAt = 0;
  // 메시지 max-height 전환 중에도 실제 카드 높이를 따라 아래 카드를 민다.
  // Codex/Claude 모양과 무관하게 같은 배치 규칙을 쓰며, top 변경은 크기를
  // 바꾸지 않으므로 observer-layout 피드백 루프가 생기지 않는다.
  const cardResizeObserver = new ResizeObserver(() => layout());

  function topMin() {
    return ctrl.offsetTop + ctrl.offsetHeight + 10;
  }

  // 도크 창은 평소 마우스 이벤트를 통과시킨다. forward 옵션으로 mousemove는
  // 계속 들어오므로, 커서가 카드나 컨트롤 패널 위에 있을 때만 이벤트를 받는다.
  let captured = false;
  function setCapture(on) {
    if (on === captured) return;
    captured = on;
    window.api.mouseCapture(on);
  }

  // suppressHover: 알림 카드를 클릭해 해소한 직후에는 커서가 아직 카드 위에
  // 있어도 hover를 무시해서, 카드가 바로 안으로 들어가게 한다. 커서가 카드를
  // 벗어나면 해제된다.
  // settling: 알림이 막 해소된 카드는 내용과 폭 전환이 끝날 때까지 펼친 채
  // 둔다. 전환 중의 낡은 폭으로 접으면 카드가 화면 밖까지 밀려 사라진다.
  // front: 맨 앞 창(현재 보고 있는 창)의 세션 카드는 펼쳐진 채 유지한다.
  // hover는 CSS :hover 대신 mousemove로 관리하는 c.hover를 쓴다. 도크 창은
  // 마우스 이벤트를 통과시키는(forward) 상태라 커서가 창 밖으로 나갈 때
  // mouseleave가 오지 않으면 :hover가 켜진 채 남을 수 있고, 그러면 접기를
  // 눌러도 그 카드만 펼쳐진 채 버틴다 (2026-09 접기 버그 의심 원인 2).
  function computeOut(c) {
    const reasons = [];
    if (allOut) reasons.push('allOut');
    if (c.state && c.state.alert) reasons.push('alert');
    if (c.state && c.state.front) reasons.push('front');
    if (c.settling) reasons.push('settling');
    if (c.hover && !c.suppressHover) reasons.push('hover');
    if (drag && drag.card === c) reasons.push('drag');
    return reasons;
  }

  function applyOut(c) {
    c.el.classList.toggle('out', computeOut(c).length > 0);
  }

  function setHover(c, on) {
    if (c.hover === on) return;
    c.hover = on;
    if (!on) c.suppressHover = false;
    applyOut(c);
  }

  function clearHovers() {
    for (const c of cards.values()) setHover(c, false);
  }

  // 진단 로그: 재현이 드문 접기 문제의 단서를 main의 diag.log 파일에 남긴다
  function diag(tag, event, data) {
    try {
      window.api.diag(tag, event, data);
    } catch (e) {
      // 로그 실패는 무시
    }
  }

  // transform 행렬에서 translateX를 읽는다 (애니메이션 중 실제 위치)
  function translateX(el) {
    const m = getComputedStyle(el).transform;
    if (!m || m === 'none') return 0;
    const parts = m.match(/matrix\(([^)]+)\)/);
    if (!parts) return 0;
    return Number(parts[1].split(',')[4]) || 0;
  }

  function ctrlSnapshot() {
    return {
      allOut,
      classes: ctrl.className,
      x: Math.round(translateX(ctrl)),
      animations: ctrl.getAnimations().map((a) => (a.animationName || 'transition:' + a.transitionProperty) + ':' + a.playState),
      pulsing: !!pulseTimer,
    };
  }

  function cardSnapshot(c) {
    return {
      key: c.el.dataset.key,
      reasons: computeOut(c),
      classOut: c.el.classList.contains('out'),
      x: Math.round(translateX(c.el)),
      peek: Math.round(parseFloat(c.el.style.getPropertyValue('--peek-x')) || 0),
      cssHover: c.el.matches(':hover'),
      animations: c.el.getAnimations().map((a) => (a.animationName || 'transition:' + a.transitionProperty) + ':' + a.playState),
    };
  }

  // 접기 조작 뒤 전환이 끝났을 시점에 실제로 접혔는지 확인한다. 접혀야 하는데
  // 펼쳐진 채면 그 순간의 상태를 통째로 남겨 다음 개발 때 원인을 좁힌다.
  function verifyCollapse(why) {
    const stuck = [];
    const ctrlOutExpected = allOut || !!pulseTimer;
    const cs = ctrlSnapshot();
    if (!ctrlOutExpected && cs.x < 100) stuck.push({ ctrl: cs });
    for (const c of cards.values()) {
      const snap = cardSnapshot(c);
      const expectedOut = snap.reasons.length > 0;
      if (!expectedOut && snap.peek > 0 && snap.x < snap.peek - 2) stuck.push(snap);
      if (snap.cssHover && !c.hover) diag('card', 'css-hover-mismatch', snap);
    }
    if (stuck.length) diag('collapse', 'stuck after ' + why, stuck);
  }

  // 접혔을 때 밀어넣는 거리 (보이는 띠 22px + 오른쪽 묻힘 11px = 33)
  function updatePeek(c) {
    c.el.style.setProperty('--peek-x', c.el.offsetWidth - 33 + 'px');
  }

  // 리셋 시각 표기. 날짜와 시각을 늘 함께 보이되 오늘, 내일은 말로 줄인다
  const DAYS = ['일', '월', '화', '수', '목', '금', '토'];
  function two(n) {
    return (n < 10 ? '0' : '') + n;
  }
  function fmtReset(d) {
    const now = new Date();
    const hm = two(d.getHours()) + ':' + two(d.getMinutes());
    const dayOf = (x) => Math.floor((x.getTime() - x.getTimezoneOffset() * 60000) / 86400000);
    const diff = dayOf(d) - dayOf(now);
    if (diff === 0) return '오늘 ' + hm;
    if (diff === 1) return '내일 ' + hm;
    return d.getMonth() + 1 + '/' + d.getDate() + ' (' + DAYS[d.getDay()] + ') ' + hm;
  }

  // 리셋까지 남은 시간을 아주 짧게 (접힌 띠 폭 26px에 들어가야 한다)
  function fmtLeft(d) {
    const ms = d.getTime() - Date.now();
    if (ms <= 0) return '';
    const min = Math.ceil(ms / 60000);
    if (min < 60) return min + 'm';
    const h = Math.floor(min / 60);
    if (h < 24) return h + 'h' + two(min % 60) + 'm';
    const days = Math.floor(h / 24);
    return days + 'd' + (h % 24) + 'h';
  }

  // 남은 시간을 말로 (툴팁과 펼친 행)
  function fmtLeftLong(d) {
    const ms = d.getTime() - Date.now();
    if (ms <= 0) return '';
    const min = Math.ceil(ms / 60000);
    if (min < 60) return min + '분 후';
    const h = Math.floor(min / 60);
    if (h < 24) return h + '시간 ' + (min % 60) + '분 후';
    return Math.floor(h / 24) + '일 ' + (h % 24) + '시간 후';
  }

  function agentName(u) {
    return u.agent === 'codex' ? 'Codex' : 'Claude';
  }

  // 마지막 갱신이 오래됐거나(2시간) 지난 실행의 저장본이면 흐리게 표시한다
  const OLD_MS = 2 * 60 * 60 * 1000;
  function isOld(u) {
    return !u.asOf || Date.now() - u.asOf > OLD_MS;
  }

  function fmtAgo(ts) {
    if (!ts) return '이전 실행에서 저장한 값';
    const min = Math.round((Date.now() - ts) / 60000);
    if (min < 1) return '방금 갱신';
    if (min < 60) return min + '분 전 갱신';
    const h = Math.floor(min / 60);
    if (h < 24) return h + '시간 ' + (min % 60) + '분 전 갱신';
    return Math.floor(h / 24) + '일 전 갱신';
  }

  function rowTitle(u, reset) {
    return (
      agentName(u) + ' ' + u.label + ' ' + u.percent + '% 사용' +
      (u.plan ? ' (' + u.plan + ')' : '') +
      (reset ? '\n재설정: ' + reset.toLocaleString() + ' (' + fmtLeftLong(reset) + ')' : '') +
      '\n' + fmtAgo(u.asOf)
    );
  }

  // 플랜 사용량 게이지. 값이 바뀔 때만 다시 그린다 (상태 메시지는
  // hook 이벤트마다 오지만 사용량은 가끔만 바뀐다). 남은 시간 표기는
  // 시간이 흐르면 달라지므로 1분마다 강제로 다시 그린다.
  let lastUsageJson = '';
  let lastUsageList = null;
  setInterval(() => renderUsage(lastUsageList, true), 60 * 1000);
  function renderUsage(list, force) {
    const json = JSON.stringify(list || null);
    if (json === lastUsageJson && !force) return;
    lastUsageJson = json;
    lastUsageList = list;
    usageEl.innerHTML = '';
    const has = Array.isArray(list) && list.length > 0;
    usageEl.classList.toggle('on', has);
    let warn = false;
    // Claude와 Codex 게이지가 함께 있으면 에이전트 제목으로 나눠 보여준다
    const mixed = has && list.some((u) => u.agent === 'codex') && list.some((u) => u.agent !== 'codex');
    let lastAgent = null;
    if (has) {
      for (const u of list) {
        const agent = u.agent === 'codex' ? 'codex' : 'claude';
        if (mixed && agent !== lastAgent) {
          const head = document.createElement('div');
          head.className = 'uHead';
          head.textContent = agent === 'codex' ? 'Codex' : 'Claude';
          usageEl.appendChild(head);
          lastAgent = agent;
        }
        const row = document.createElement('div');
        row.className =
          'uRow' + (u.percent >= 95 ? ' crit' : u.percent >= 80 ? ' warn' : '') + (isOld(u) ? ' old' : '');
        if (u.percent >= 80) warn = true;
        const reset = u.resetsAt ? new Date(u.resetsAt) : null;
        row.title = rowTitle(u, reset);
        row.innerHTML =
          '<div class="uLabel"></div><div class="uBar"><div class="uFill"></div></div>' +
          '<div class="uPct"></div>';
        row.querySelector('.uLabel').textContent = u.label;
        row.querySelector('.uFill').style.width = Math.min(100, u.percent) + '%';
        row.querySelector('.uPct').textContent = u.percent + '%';
        usageEl.appendChild(row);
        // 리셋 날짜와 시각은 툴팁이 아니라 행 아래에 늘 보인다
        const resetEl = document.createElement('div');
        resetEl.className = 'uReset' + (isOld(u) ? ' old' : '');
        if (reset && !isNaN(reset.getTime())) {
          const when = document.createElement('span');
          when.className = 'when';
          when.textContent = '리셋 ' + fmtReset(reset);
          resetEl.appendChild(when);
          const left = fmtLeft(reset);
          if (left) {
            const l = document.createElement('span');
            l.className = 'left';
            l.textContent = left;
            resetEl.appendChild(l);
          }
          resetEl.title = row.title;
        }
        usageEl.appendChild(resetEl);
      }
    }
    ctrl.classList.toggle('usageWarn', warn);
    // 접힌 토글 아래에 상시 표시: 지금 쓰고 있는 세션(5시간 창) 사용량만.
    // Claude 세션과, Codex에 세션 창 한도가 오는 플랜이면 그것도. 주간 한도
    // (전체, Fable 등 모델별, Codex 주간)는 펼쳤을 때 행으로 본다
    // (사용자 결정 2026-09-23: 접혔을 때는 당장 쓰는 것의 정보만).
    // 각각 % 아래에 리셋까지 남은 시간을 붙인다
    tPct.innerHTML = '';
    const session = has ? list.find((u) => u.key === 'session') : null;
    const codex = has
      ? list.find((u) => u.agent === 'codex' && u.windowMinutes > 0 && u.windowMinutes <= 300)
      : null;
    // 접힌 띠: % 아래에 리셋까지 남은 시간을 짧게 붙인다 (요청: 얼마나 남았고
    // 언제 리셋되는지를 펼치지 않아도 알 수 있게)
    const strip = (u, cls, lab) => {
      const wrap = document.createElement('span');
      wrap.className = cls + (isOld(u) ? ' old' : '');
      const reset = u.resetsAt ? new Date(u.resetsAt) : null;
      wrap.title = rowTitle(u, reset);
      if (lab) {
        const l = document.createElement('span');
        l.className = 'tLab';
        l.textContent = lab;
        wrap.appendChild(l);
      }
      const pct = document.createElement('span');
      pct.textContent = u.percent + '%';
      wrap.appendChild(pct);
      const left = reset ? fmtLeft(reset) : '';
      if (left) {
        const l = document.createElement('span');
        l.className = 'tLeft';
        l.textContent = left;
        wrap.appendChild(l);
      }
      tPct.appendChild(wrap);
    };
    if (session) strip(session, 'claude', '');
    if (codex) strip(codex, 'codex', '');
    layout();
  }

  // 사용량 계단 돌파: 패널을 잠깐 펼치고 바운스를 재생한다. 소리는 없고
  // (진행 정보일 뿐 행동 요구가 아니다), 임계선(80, 95%)은 main이 소리와
  // 테두리 번쩍임을 더한다.
  let lastPulse = null;
  let pulseTimer = 0;
  function setArrow() {
    const out = ctrl.classList.contains('out');
    tArrow.textContent = out ? '›' : '‹';
    toggle.title = out ? (allOut ? '모두 접기' : '패널 접기') : '모두 펼치기';
  }

  function usagePulse() {
    ctrl.classList.remove('boing');
    void ctrl.offsetWidth;
    ctrl.classList.add('out', 'boing');
    setArrow();
    clearTimeout(pulseTimer);
    pulseTimer = setTimeout(() => endPulse('timer'), 6500);
    diag('ctrl', 'pulse start', ctrlSnapshot());
  }

  // 펄스 종료: 바운스를 멈추고, 사용자가 펼쳐 둔 상태가 아니면 접는다
  function endPulse(why) {
    clearTimeout(pulseTimer);
    pulseTimer = 0;
    ctrl.classList.remove('boing');
    if (!allOut) ctrl.classList.remove('out');
    setArrow();
    diag('ctrl', 'pulse end (' + why + ')', ctrlSnapshot());
  }

  let settleTimer = 0;
  // 상태 변화 후 전환이 끝난 시점에 카드별로 한 번: 해소된 알림의 잔여 텍스트를
  // 비우고, 최종 크기로 접힘 거리와 세로 배치를 다시 잰다. 알림이 뜰 때 늘어난
  // 높이의 겹침 밀어내기와 해소 시 줄어든 폭의 접힘 거리가 모두 여기서 확정된다.
  // 만기(settleAt)는 카드별로 두고 타이머는 하나만 돌린다. 예전에는 상태 갱신마다
  // 타이머를 다시 걸어서, 도구 이벤트가 320ms보다 잦게 몰리면 settle이 계속
  // 미뤄지고 해소된 알림 카드가 접기를 눌러도 펼쳐진 채 남았다
  // (2026-09 접기 버그 원인 3).
  function scheduleSettle(delay) {
    if (settleTimer) return;
    settleTimer = setTimeout(settle, delay == null ? SETTLE_MS : delay);
  }

  function settle() {
    settleTimer = 0;
    // 타이머는 만기보다 몇 ms 일찍 깨어날 수 있으므로 약간의 여유를 둔다
    const now = Date.now() + 8;
    let next = 0;
    for (const c of cards.values()) {
      if (!c.state || !c.settleAt) continue;
      if (c.settleAt > now) {
        next = next ? Math.min(next, c.settleAt) : c.settleAt;
        continue;
      }
      c.settleAt = 0;
      if (!c.state.alert && (c.msg.textContent || c.desc.textContent)) {
        c.msg.textContent = '';
        c.msg.title = '';
        c.desc.textContent = '';
        c.desc.title = '';
      }
      c.settling = false;
      updatePeek(c);
      applyOut(c);
    }
    layout();
    if (next) scheduleSettle(Math.max(10, next - Date.now()));
  }

  // 투명도는 전역 하나를 일반 카드와 컨트롤 패널에 똑같이 적용한다.
  // 단, 알림이 떠서 판단이 필요한 카드는 전역 값과 무관하게 불투명하게
  // 강조한다. 유휴(stale) 카드는 상태 표시로 전역 값에 0.45를 곱한다.
  function applyOpacity(c) {
    if (c.state && c.state.alert) {
      c.el.style.opacity = '';
      return;
    }
    c.el.style.opacity = String(opacity * (c.state && c.state.stale ? 0.45 : 1));
  }

  function applyGlobalOpacity() {
    ctrl.style.opacity = String(opacity);
    for (const c of cards.values()) applyOpacity(c);
  }

  toggle.addEventListener('click', () => {
    const before = { ctrl: ctrlSnapshot(), cards: [...cards.values()].map(cardSnapshot) };
    // 커서는 토글 위에 있으므로 어떤 카드도 hover일 수 없다
    clearHovers();
    if (!allOut && ctrl.classList.contains('out')) {
      // 사용량 펄스로 잠깐 펼쳐진 패널. 화살표가 접기(›)를 가리키므로 펄스만 끝낸다
      endPulse('toggle');
    } else {
      allOut = !allOut;
      if (allOut) ctrl.classList.add('out');
      else endPulse('toggle');
      for (const c of cards.values()) applyOut(c);
    }
    setArrow();
    diag('ctrl', 'toggle', { before, after: ctrlSnapshot() });
    setTimeout(() => verifyCollapse('toggle'), SETTLE_MS + 200);
  });

  opSlider.addEventListener('input', () => {
    opacity = Number(opSlider.value) / 100;
    opTouchedAt = Date.now();
    window.api.setOpacity(opacity);
    applyGlobalOpacity();
  });

  // 화면 표시용 배치: 카드는 저장 위치(baseY)를 그대로 쓴다. 알림으로
  // 카드가 제자리에서 커져 아래 카드와 겹치면 화면에서만 아래로 민다.
  // 저장 위치는 건드리지 않아 알림이 풀리면 모두 제자리로 돌아온다.
  // 드래그 중인 카드는 건드리지 않는다. 알림 사이의 순서(최신 우선)는
  // 위치가 아니라 글로우와 전역 단축키 대상 선정에만 쓰인다.
  function layout() {
    const items = [...cards.values()]
      .filter((c) => c.baseY != null && !(drag && drag.card === c))
      .sort((a, b) => a.baseY - b.baseY || (a.el.dataset.key < b.el.dataset.key ? -1 : 1));
    let cursor = topMin();
    for (const c of items) {
      const y = Math.max(c.baseY, cursor);
      c.el.style.top = y + 'px';
      cursor = y + c.el.offsetHeight + GAP;
    }
  }

  // 드랍 시 겹침 해소. 놓는 카드(c)를 y에 두는 것을 기준으로:
  // 1) 중심이 위인 카드들은 겹치는 만큼 위로 연쇄해서 밀어낸다
  //    (이 단계에서는 컨트롤 패널 영역 침범을 허용한다)
  // 2) [위쪽 카드들, 놓는 카드, 아래쪽 카드들] 순서로 위에서부터 훑으며
  //    컨트롤 패널 아래(topMin)부터 차례로 자리를 보장한다. 위쪽 연쇄가
  //    패널을 침범했다면 여기서 다시 아래로 밀리면서, 놓는 카드조차
  //    아래로 밀려나는 요구 동작이 자연스럽게 나온다.
  // 바뀐 위치는 전부 저장한다.
  function resolveDrop(c, y) {
    const MIN = topMin();
    const h = c.el.offsetHeight;
    y = Math.max(MIN, y);
    const myCenter = y + h / 2;
    const others = [...cards.values()].filter((o) => o !== c && o.baseY != null);
    const above = others.filter((o) => o.baseY + o.el.offsetHeight / 2 <= myCenter);
    const below = others.filter((o) => o.baseY + o.el.offsetHeight / 2 > myCenter);

    const oldY = new Map(others.map((o) => [o, o.baseY]));
    c.baseY = y;

    // 1) 위쪽 연쇄: 놓는 카드에 가까운 것부터, 겹치면 위로 올린다
    above.sort((a, b) => b.baseY - a.baseY);
    let limit = y - GAP;
    for (const o of above) {
      const oh = o.el.offsetHeight;
      if (o.baseY + oh > limit) o.baseY = limit - oh;
      limit = o.baseY - GAP;
    }

    // 2) 위에서부터 아래로 자리 보장 (놓는 카드의 의도된 순서 유지)
    above.sort((a, b) => a.baseY - b.baseY);
    below.sort((a, b) => a.baseY - b.baseY);
    const seq = above.concat([c], below);
    let cursor = MIN;
    for (const o of seq) {
      if (o.baseY < cursor) o.baseY = cursor;
      cursor = o.baseY + o.el.offsetHeight + GAP;
    }

    const changed = { [c.el.dataset.key]: c.baseY };
    c.movedAt = Date.now();
    for (const o of others) {
      if (o.baseY !== oldY.get(o)) {
        o.movedAt = Date.now();
        changed[o.el.dataset.key] = o.baseY;
      }
    }
    window.api.setY(changed);
    layout();
  }

  // key: 세션 키 (claude는 cwd, codex는 'codex:' + cwd, 같은 폴더의 추가
  // 세션은 '#<session_id>' 접미사). main과 주고받는 id다
  function makeCard(key) {
    const el = document.createElement('div');
    el.className = 'card';
    el.dataset.key = key;
    el.innerHTML =
      '<div class="spin"></div>' +
      '<div class="name"></div><div class="msg"></div>' +
      '<div class="desc"></div><div class="err"></div>' +
      '<div class="x" title="알림만 닫기 (창 전환 없음)">✕</div>';
    const c = {
      el,
      name: el.querySelector('.name'),
      msg: el.querySelector('.msg'),
      desc: el.querySelector('.desc'),
      err: el.querySelector('.err'),
      state: null,
      baseY: null,
      movedAt: 0,
      bump: '',
      settling: false,
      suppressHover: false,
      hover: false,
      settleAt: 0,
      sig: '',
    };
    el.addEventListener('mouseenter', () => setHover(c, true));
    el.addEventListener('mouseleave', () => setHover(c, false));

    el.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      window.api.menu(key);
    });

    el.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      down = { c, y: e.screenY };
    });

    // x 버튼: 카드 클릭(창 전환)과 드래그로 번지지 않게 mousedown부터 끊고,
    // 창 전환 없이 알림만 해소한다. 커서가 아직 카드 위여도 바로 접히도록
    // 카드 클릭 해소와 같은 suppressHover를 쓴다
    const x = el.querySelector('.x');
    x.addEventListener('mousedown', (e) => e.stopPropagation());
    x.addEventListener('mouseup', (e) => e.stopPropagation());
    x.addEventListener('click', (e) => {
      e.stopPropagation();
      c.suppressHover = true;
      window.api.dismiss(key);
    });

    return c;
  }

  // 드래그 시작: 카드가 커서를 그대로 따라간다. 다른 카드는 놓기 전까지
  // 움직이지 않고, 놓는 순간 resolveDrop이 밀어낸다.
  function startDrag(c, e) {
    const r = c.el.getBoundingClientRect();
    drag = { card: c, offsetY: e.clientY - r.top };
    c.el.classList.add('dragging');
    c.el.style.top = r.top + 'px';
    applyOut(c);
  }

  function endDrag() {
    const c = drag.card;
    const y = parseFloat(c.el.style.top) || topMin();
    c.el.classList.remove('dragging');
    drag = null;
    applyOut(c);
    resolveDrop(c, y);
  }

  document.addEventListener('mousemove', (e) => {
    if (drag) {
      drag.card.el.style.top = e.clientY - drag.offsetY + 'px';
      return;
    }
    if (down && Math.abs(e.screenY - down.y) > 6) {
      startDrag(down.c, e);
      return;
    }
    const overCard = e.target.closest('.card');
    for (const c of cards.values()) setHover(c, overCard === c.el);
    setCapture(!!(overCard || e.target.closest('#ctrl')));
  });

  document.addEventListener('mouseup', () => {
    if (drag) endDrag();
    else if (down) {
      // 알림 카드를 클릭하면 알림이 해소되면서 카드가 바로 안으로 들어간다
      if (down.c.state && down.c.state.alert) down.c.suppressHover = true;
      window.api.focus(down.c.el.dataset.key);
    }
    down = null;
  });

  document.documentElement.addEventListener('mouseleave', () => {
    if (drag) endDrag();
    clearHovers();
    setCapture(false);
  });

  window.api.onState((state) => {
    const list = state.cards || [];
    renderUsage(state.usage);
    // 첫 상태 수신은 기준값 기록만 하고, 이후 pulse 값 변화만 알림으로 본다
    if (state.usagePulse !== lastPulse) {
      const first = lastPulse === null;
      lastPulse = state.usagePulse;
      if (!first) usagePulse();
    }
    // 슬라이더를 막 움직인 직후에는 전송 중이던 옛 값이 덮지 않게 한다
    if (Date.now() - opTouchedAt > 2000) {
      opacity = state.opacity || 1;
      opSlider.value = String(Math.round(opacity * 100));
      applyGlobalOpacity();
    }

    const seen = new Set();
    const fresh = [];
    for (const s of list) {
      const key = s.key || s.cwd;
      seen.add(key);
      let c = cards.get(key);
      let isNew = false;
      if (!c) {
        c = makeCard(key);
        cards.set(key, c);
        document.body.appendChild(c.el);
        cardResizeObserver.observe(c.el);
        isNew = true;
      }
      const hadAlert = !!(c.state && c.state.alert);
      c.state = s;
      // 막 드랍해서 저장이 도는 중인 카드는 옛 y가 덮지 않게 잠시 보호한다
      if (s.y != null && Date.now() - c.movedAt > 2000) c.baseY = s.y;
      c.name.textContent = s.name || '';
      c.name.title =
        (s.agent === 'codex' ? (s.desktop ? 'Codex 앱' : 'Codex') : 'Claude Code') + '  ' + s.cwd +
        (s.origin ? '\n출처: ' + s.origin : '') + '\n클릭하면 해당 창이 열립니다';
      c.el.classList.toggle('codex', s.agent === 'codex');
      if (s.alert) {
        c.msg.textContent = s.message || '';
        c.msg.title = s.message || '';
        c.desc.textContent = s.desc || '';
        c.desc.title = s.desc || '';
        // 새 알림이나 1분 재알림이면(bump 변화) 바운스를 처음부터 다시 재생
        if (c.bump !== s.bump) {
          c.bump = s.bump;
          c.el.style.animation = 'none';
          void c.el.offsetWidth;
          c.el.style.animation = '';
        }
      } else {
        c.bump = '';
        // 해소 직후에는 펼친 채로 두고(settling), 텍스트 비우기와 접힘 거리
        // 재측정은 전환이 끝난 뒤 settle()이 한다. 전환 중의 낡은 폭으로
        // 바로 접으면 카드가 화면 밖으로 사라지는 문제가 있었다
        if (hadAlert) c.settling = true;
      }
      c.err.textContent = s.err || '';
      // 크기에 영향을 주는 값이 바뀐 카드만 전환 뒤 settle 대상이 된다
      const sig = [s.name, s.agent, !!s.alert, s.alert ? s.message : '', s.alert ? s.desc : '', s.err]
        .join('\u0000');
      if (sig !== c.sig) {
        c.sig = sig;
        c.settleAt = Date.now() + SETTLE_MS;
      }
      c.el.classList.toggle('alert', !!s.alert);
      c.el.classList.toggle('working', !!s.working);
      c.el.classList.toggle('waiting', !s.alert && !s.working);
      c.el.classList.toggle('input', s.kind === 'input');
      c.el.classList.toggle('done', s.kind === 'done');
      c.el.classList.toggle('target', !!s.target && !!s.alert);
      // 새 카드는 즉시 접힘 거리를 잰다 (첫 렌더에는 전환이 없어 최종 폭이다).
      // 기존 카드는 전환 중일 수 있으므로 settle()이 최종 폭으로 다시 잰다
      if (isNew) updatePeek(c);
      applyOut(c);
      applyOpacity(c);
      if (c.baseY == null) fresh.push(c);
    }
    for (const [key, c] of [...cards]) {
      if (!seen.has(key)) {
        if (drag && drag.card === c) {
          drag = null;
          c.el.classList.remove('dragging');
        }
        cardResizeObserver.unobserve(c.el);
        c.el.remove();
        cards.delete(key);
      }
    }
    // 위치가 없는 새 카드는 기존 카드들 아래 빈자리에 차례로 배치하고 저장한다
    if (fresh.length) {
      let bottom = topMin();
      for (const c of cards.values()) {
        if (c.baseY != null) bottom = Math.max(bottom, c.baseY + c.el.offsetHeight + GAP + 2);
      }
      const assigned = {};
      for (const c of fresh) {
        c.baseY = bottom;
        assigned[c.el.dataset.key] = bottom;
        bottom += c.el.offsetHeight + GAP + 2;
      }
      window.api.setY(assigned);
    }
    layout();
    // 전환이 끝난 뒤 최종 크기로 접힘 거리와 배치를 확정한다
    scheduleSettle();
  });
</script>
</body>
</html>
