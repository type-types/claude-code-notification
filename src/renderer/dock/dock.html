<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    user-select: none;
    cursor: default;
    /* max-content <-> 고정폭 사이의 width 전환을 허용 (알림 해소 시 부드럽게 줄어들도록) */
    interpolate-size: allow-keywords;
  }
  /* 컨트롤 패널: 맨 위에 상시 노출. 접혀 있으면 [<] 버튼만 보이고,
     누르면 왼쪽으로 튀어나오며 전체 펼침 + 투명도 슬라이더가 나타난다 */
  #ctrl {
    position: absolute;
    top: 14px;
    right: 0;
    width: 148px;
    box-sizing: border-box;
    display: flex;
    align-items: stretch;
    border-radius: 10px 0 0 10px;
    background: rgba(255, 255, 255, 0.88);
    border: 1px solid rgba(0, 0, 0, 0.2);
    border-right: none;
    transform: translateX(122px);
    transition: transform 0.22s ease;
    z-index: 5;
  }
  #ctrl.out {
    transform: translateX(0);
  }
  #toggle {
    flex: 0 0 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: rgba(0, 0, 0, 0.55);
    border-right: 1px solid rgba(0, 0, 0, 0.08);
    border-radius: 10px 0 0 10px;
    cursor: pointer;
  }
  #toggle:hover {
    background: rgba(0, 0, 0, 0.06);
    color: #000;
  }
  #ctrl.out #toggle {
    color: #0a60c2;
  }
  #ctrlBody {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    padding: 9px 12px;
  }
  /* 투명도 슬라이더: 얇은 트랙과 작은 막대형 손잡이 */
  #op {
    -webkit-appearance: none;
    flex: 1;
    min-width: 0;
    height: 3px;
    border-radius: 2px;
    background: rgba(0, 0, 0, 0.22);
    outline: none;
  }
  #op::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 5px;
    height: 13px;
    border-radius: 3px;
    background: #0a60c2;
  }
  /* 카드: 각자 저장된 세로 위치(top)에 자유 배치된다. 평소에는 오른쪽으로
     밀려 들어가 왼쪽 가장자리 22px 띠만 보이고, hover / 전체 펼침 / 알림 시
     왼쪽으로 튀어나온다. 폭은 내용 길이에 맞추므로 밀어넣는 거리는 JS가
     카드별로 측정해 --peek-x 변수로 넣는다. top 변화는 부드럽게 움직여서
     겹침 해소로 밀려나는 모습이 자연스럽다.
     카드는 4방 테두리와 둥근 모서리를 가진 완성형이고, 평소에는 오른쪽
     11px(모서리 반경 + 테두리)를 화면 밖에 묻어 도크에 붙은 모양을 낸다.
     바운스로 뛰어오르면 잘린 면이 아니라 온전한 오른쪽 모서리가 드러난다.
     불변식 1: 접혔을 때 보이는 폭(22px) <= 테두리(1px) + 왼쪽 여백(26px).
     글자는 여백 안으로 들어올 수 없으므로, 접힌 띠에 글자 조각이
     보이는 일이 구조적으로 없다. 보이는 폭을 키우면 여백도 같이 키울 것.
     불변식 2: JS의 접힘 거리 계산(offsetWidth - 33)은 보이는 폭 22px과
     오른쪽 묻힘 11px의 합과 일치해야 한다 */
  .card {
    position: absolute;
    right: -11px;
    width: max-content;
    min-width: 72px;
    max-width: 248px;
    box-sizing: border-box;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.88);
    border: 1px solid rgba(0, 0, 0, 0.2);
    color: #1c1c1e;
    padding: 13px 24px 13px 26px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: 28px;
    transform: translateX(var(--peek-x, 39px));
    transition: top 0.25s ease, transform 0.22s ease, background 0.25s, border-color 0.25s,
      width 0.25s ease;
  }
  /* 알림 카드는 메시지가 보이도록 최대 폭으로 고정 */
  .card.alert {
    width: 248px;
  }
  .card.out {
    transform: translateX(0);
  }
  /* 드래그 중인 카드는 애니메이션 없이 커서를 그대로 따라간다 */
  .card.dragging {
    transition: background 0.25s, border-color 0.25s;
    opacity: 0.9 !important;
    border-color: rgba(0, 0, 0, 0.5);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    z-index: 10;
  }
  .name {
    font-size: 12px;
    font-weight: 600;
    line-height: 1.3;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  /* 알림 내용은 display 토글 대신 max-height 전환으로 나타나고 사라져서,
     알림이 뜨고 닫힐 때 카드 높이가 부드럽게 늘고 준다.
     전환 시간(0.25s)을 바꾸면 JS의 SETTLE_MS도 같이 볼 것 */
  .msg,
  .desc {
    overflow: hidden;
    max-height: 0;
    margin-top: 0;
    opacity: 0;
    transition: max-height 0.25s ease, margin-top 0.25s ease, opacity 0.2s ease;
  }
  .msg {
    display: -webkit-box;
    font-size: 10px;
    line-height: 1.35;
    color: #5a3c00;
    word-break: break-all;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
  }
  .desc {
    font-size: 9.5px;
    line-height: 1.3;
    color: rgba(90, 60, 0, 0.65);
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .err {
    font-size: 10px;
    color: #a33000;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 5px;
  }
  .err:empty {
    display: none;
  }
  .card.alert {
    background: rgba(255, 216, 140, 0.94);
    border-color: rgba(200, 130, 20, 0.8);
  }
  .card.alert .msg {
    max-height: 28px;
    margin-top: 5px;
    opacity: 1;
  }
  .card.alert .desc {
    max-height: 13px;
    margin-top: 4px;
    opacity: 1;
  }
  .card.alert .desc:empty {
    max-height: 0;
    margin-top: 0;
  }
  .card.input {
    background: rgba(190, 220, 255, 0.94);
    border-color: rgba(40, 100, 190, 0.7);
  }
  .card.input .msg {
    color: #123c6e;
  }
  /* 작업 완료 알림: 초록색 계열. 다음 요청을 보내면 된다는 신호 */
  .card.done {
    background: rgba(198, 236, 198, 0.94);
    border-color: rgba(45, 140, 70, 0.75);
  }
  .card.done .msg {
    color: #1a5c2e;
  }
  .card.done .desc {
    color: rgba(26, 92, 46, 0.65);
  }
  /* 가장 최근 알림 카드: 은은한 글로우로 강조. 전역 단축키의 대상이다 */
  .card.target {
    box-shadow: 0 0 14px rgba(214, 138, 16, 0.6);
  }
  .card.target.input {
    box-shadow: 0 0 14px rgba(40, 100, 190, 0.55);
  }
  .card.target.done {
    box-shadow: 0 0 14px rgba(45, 160, 85, 0.55);
  }
  /* 알림 카드의 도크식 바운스: 오른쪽 가장자리가 땅이고 중력이 그쪽에
     있다는 느낌으로, 왼쪽으로 뛰어올랐다가 떨어지며 착지 때 살짝 눌리고
     잦아든다. 8회 재생 후 멈추고(상시 애니메이션으로 전력을 낭비하지
     않도록), 새 알림이나 1분 재알림 때 bump 값 변화로 다시 재생된다 */
  @keyframes boing {
    0% { transform: translateX(0); animation-timing-function: cubic-bezier(0.2, 0.7, 0.4, 1); }
    8% { transform: translateX(-18px); animation-timing-function: cubic-bezier(0.55, 0, 0.85, 0.45); }
    15% { transform: translateX(0) scaleX(0.96); animation-timing-function: cubic-bezier(0.2, 0.7, 0.4, 1); }
    21% { transform: translateX(-8px); animation-timing-function: cubic-bezier(0.55, 0, 0.85, 0.45); }
    26% { transform: translateX(0) scaleX(0.985); animation-timing-function: cubic-bezier(0.2, 0.7, 0.4, 1); }
    30% { transform: translateX(-3px); animation-timing-function: cubic-bezier(0.55, 0, 0.85, 0.45); }
    34%, 100% { transform: translateX(0); }
  }
  .card.alert:not(.dragging) {
    transform-origin: right center;
    animation: boing 3s 0.4s 8;
  }
  /* hover 중에는 제자리에 일시정지해 클릭 조준을 방해하지 않는다.
     제거가 아니라 정지라서, 카드가 커서 밑으로 뛰어든 순간 스냅백과
     재시작이 반복되는 깜빡임 루프가 생기지 않는다 */
  .card.alert:hover {
    animation-play-state: paused;
  }
  /* 상태 2종: 세션은 항상 작업 중이거나 입력 대기다.
     작업 중은 보라색 숨쉬기, 입력 대기(유휴)는 옅은 파란 기운.
     파랑은 내 차례, 보라는 Claude 차례라는 의미로 알림 색과도 이어진다.
     숨쉬기는 배경색 애니메이션 대신 보라 틴트 오버레이(::before)의
     opacity만 움직여 컴포지터에서 처리된다. 배경색을 직접 움직이면 상시
     최상단 창이 턴 내내 매 프레임 리페인트된다 */
  @keyframes breathe {
    0%, 100% { opacity: 0; }
    50% { opacity: 1; }
  }
  .card.working {
    border-color: rgba(112, 80, 220, 0.45);
  }
  .card.working::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 9px;
    background: rgba(219, 208, 255, 0.55);
    opacity: 0;
    animation: breathe 2.4s ease-in-out infinite;
    pointer-events: none;
  }
  /* 글자들을 틴트 오버레이 위 페인트 순서로 올린다 */
  .card .name,
  .card .msg,
  .card .desc,
  .card .err {
    position: relative;
  }
  .card.waiting {
    background: rgba(226, 238, 252, 0.9);
    border-color: rgba(80, 125, 195, 0.4);
  }
  /* 작업 중 스피너: 접혀 있어도 보이는 왼쪽 띠 안에서 돈다.
     steps로 12fps만 그려 상시 프레임 생산을 줄인다 */
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .spin {
    display: none;
    position: absolute;
    left: 6px;
    top: 50%;
    margin-top: -5px;
    width: 10px;
    height: 10px;
    box-sizing: border-box;
    border: 2px solid rgba(112, 80, 220, 0.22);
    border-top-color: rgba(112, 80, 220, 0.85);
    border-radius: 50%;
    animation: spin 1s steps(12, end) infinite;
  }
  .card.working .spin {
    display: block;
  }
</style>
</head>
<body>
  <div id="ctrl">
    <div id="toggle" title="모두 펼치기">‹</div>
    <div id="ctrlBody">
      <input id="op" type="range" min="20" max="100" step="1" value="100" title="투명도">
    </div>
  </div>
<script>
  const ctrl = document.getElementById('ctrl');
  const toggle = document.getElementById('toggle');
  const opSlider = document.getElementById('op');
  const cards = new Map();
  const GAP = 6;
  // 상태 변화 후 CSS 전환(0.25s)이 끝나고 나서 재측정하는 시점
  const SETTLE_MS = 320;

  let down = null;
  let drag = null;
  let allOut = false;
  let opacity = 1;
  // 로컬에서 막 바꾼 값이 전송 중이던 옛 상태에 덮이지 않도록 잠시 지키는 시각
  let opTouchedAt = 0;

  function topMin() {
    return ctrl.offsetTop + ctrl.offsetHeight + 10;
  }

  // 도크 창은 평소 마우스 이벤트를 통과시킨다. forward 옵션으로 mousemove는
  // 계속 들어오므로, 커서가 카드나 컨트롤 패널 위에 있을 때만 이벤트를 받는다.
  let captured = false;
  function setCapture(on) {
    if (on === captured) return;
    captured = on;
    window.api.mouseCapture(on);
  }

  // suppressHover: 알림 카드를 클릭해 해소한 직후에는 커서가 아직 카드 위에
  // 있어도 hover를 무시해서, 카드가 바로 안으로 들어가게 한다. 커서가 카드를
  // 벗어나면 해제된다.
  // settling: 알림이 막 해소된 카드는 내용과 폭 전환이 끝날 때까지 펼친 채
  // 둔다. 전환 중의 낡은 폭으로 접으면 카드가 화면 밖까지 밀려 사라진다.
  function applyOut(c) {
    const out =
      allOut ||
      (c.state && c.state.alert) ||
      c.settling ||
      (c.el.matches(':hover') && !c.suppressHover) ||
      (drag && drag.card === c);
    c.el.classList.toggle('out', !!out);
  }

  // 접혔을 때 밀어넣는 거리 (보이는 띠 22px + 오른쪽 묻힘 11px = 33)
  function updatePeek(c) {
    c.el.style.setProperty('--peek-x', c.el.offsetWidth - 33 + 'px');
  }

  let settleTimer = 0;
  // 상태 변화 후 전환이 끝난 시점에 한 번: 해소된 알림의 잔여 텍스트를 비우고,
  // 최종 크기로 접힘 거리와 세로 배치를 다시 잰다. 알림이 뜰 때 늘어난 높이의
  // 겹침 밀어내기와 해소 시 줄어든 폭의 접힘 거리가 모두 여기서 확정된다.
  function settle() {
    for (const c of cards.values()) {
      if (!c.state) continue;
      if (!c.state.alert && (c.msg.textContent || c.desc.textContent)) {
        c.msg.textContent = '';
        c.msg.title = '';
        c.desc.textContent = '';
        c.desc.title = '';
      }
      c.settling = false;
      updatePeek(c);
      applyOut(c);
    }
    layout();
  }

  // 투명도는 전역 하나를 일반 카드와 컨트롤 패널에 똑같이 적용한다.
  // 단, 알림이 떠서 판단이 필요한 카드는 전역 값과 무관하게 불투명하게
  // 강조한다. 유휴(stale) 카드는 상태 표시로 전역 값에 0.45를 곱한다.
  function applyOpacity(c) {
    if (c.state && c.state.alert) {
      c.el.style.opacity = '';
      return;
    }
    c.el.style.opacity = String(opacity * (c.state && c.state.stale ? 0.45 : 1));
  }

  function applyGlobalOpacity() {
    ctrl.style.opacity = String(opacity);
    for (const c of cards.values()) applyOpacity(c);
  }

  toggle.addEventListener('click', () => {
    allOut = !allOut;
    ctrl.classList.toggle('out', allOut);
    toggle.textContent = allOut ? '›' : '‹';
    toggle.title = allOut ? '모두 접기' : '모두 펼치기';
    for (const c of cards.values()) applyOut(c);
  });

  opSlider.addEventListener('input', () => {
    opacity = Number(opSlider.value) / 100;
    opTouchedAt = Date.now();
    window.api.setOpacity(opacity);
    applyGlobalOpacity();
  });

  // 화면 표시용 배치: 카드는 저장 위치(baseY)를 그대로 쓴다. 알림으로
  // 카드가 제자리에서 커져 아래 카드와 겹치면 화면에서만 아래로 민다.
  // 저장 위치는 건드리지 않아 알림이 풀리면 모두 제자리로 돌아온다.
  // 드래그 중인 카드는 건드리지 않는다. 알림 사이의 순서(최신 우선)는
  // 위치가 아니라 글로우와 전역 단축키 대상 선정에만 쓰인다.
  function layout() {
    const items = [...cards.values()]
      .filter((c) => c.baseY != null && !(drag && drag.card === c))
      .sort((a, b) => a.baseY - b.baseY || (a.el.dataset.cwd < b.el.dataset.cwd ? -1 : 1));
    let cursor = topMin();
    for (const c of items) {
      const y = Math.max(c.baseY, cursor);
      c.el.style.top = y + 'px';
      cursor = y + c.el.offsetHeight + GAP;
    }
  }

  // 드랍 시 겹침 해소. 놓는 카드(c)를 y에 두는 것을 기준으로:
  // 1) 중심이 위인 카드들은 겹치는 만큼 위로 연쇄해서 밀어낸다
  //    (이 단계에서는 컨트롤 패널 영역 침범을 허용한다)
  // 2) [위쪽 카드들, 놓는 카드, 아래쪽 카드들] 순서로 위에서부터 훑으며
  //    컨트롤 패널 아래(topMin)부터 차례로 자리를 보장한다. 위쪽 연쇄가
  //    패널을 침범했다면 여기서 다시 아래로 밀리면서, 놓는 카드조차
  //    아래로 밀려나는 요구 동작이 자연스럽게 나온다.
  // 바뀐 위치는 전부 저장한다.
  function resolveDrop(c, y) {
    const MIN = topMin();
    const h = c.el.offsetHeight;
    y = Math.max(MIN, y);
    const myCenter = y + h / 2;
    const others = [...cards.values()].filter((o) => o !== c && o.baseY != null);
    const above = others.filter((o) => o.baseY + o.el.offsetHeight / 2 <= myCenter);
    const below = others.filter((o) => o.baseY + o.el.offsetHeight / 2 > myCenter);

    const oldY = new Map(others.map((o) => [o, o.baseY]));
    c.baseY = y;

    // 1) 위쪽 연쇄: 놓는 카드에 가까운 것부터, 겹치면 위로 올린다
    above.sort((a, b) => b.baseY - a.baseY);
    let limit = y - GAP;
    for (const o of above) {
      const oh = o.el.offsetHeight;
      if (o.baseY + oh > limit) o.baseY = limit - oh;
      limit = o.baseY - GAP;
    }

    // 2) 위에서부터 아래로 자리 보장 (놓는 카드의 의도된 순서 유지)
    above.sort((a, b) => a.baseY - b.baseY);
    below.sort((a, b) => a.baseY - b.baseY);
    const seq = above.concat([c], below);
    let cursor = MIN;
    for (const o of seq) {
      if (o.baseY < cursor) o.baseY = cursor;
      cursor = o.baseY + o.el.offsetHeight + GAP;
    }

    const changed = { [c.el.dataset.cwd]: c.baseY };
    c.movedAt = Date.now();
    for (const o of others) {
      if (o.baseY !== oldY.get(o)) {
        o.movedAt = Date.now();
        changed[o.el.dataset.cwd] = o.baseY;
      }
    }
    window.api.setY(changed);
    layout();
  }

  function makeCard(cwd) {
    const el = document.createElement('div');
    el.className = 'card';
    el.dataset.cwd = cwd;
    el.innerHTML =
      '<div class="spin"></div>' +
      '<div class="name"></div><div class="msg"></div>' +
      '<div class="desc"></div><div class="err"></div>';
    const c = {
      el,
      name: el.querySelector('.name'),
      msg: el.querySelector('.msg'),
      desc: el.querySelector('.desc'),
      err: el.querySelector('.err'),
      state: null,
      baseY: null,
      movedAt: 0,
      bump: '',
      settling: false,
      suppressHover: false,
    };
    el.addEventListener('mouseenter', () => applyOut(c));
    el.addEventListener('mouseleave', () => {
      c.suppressHover = false;
      applyOut(c);
    });

    el.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      window.api.menu(cwd);
    });

    el.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      down = { c, y: e.screenY };
    });

    return c;
  }

  // 드래그 시작: 카드가 커서를 그대로 따라간다. 다른 카드는 놓기 전까지
  // 움직이지 않고, 놓는 순간 resolveDrop이 밀어낸다.
  function startDrag(c, e) {
    const r = c.el.getBoundingClientRect();
    drag = { card: c, offsetY: e.clientY - r.top };
    c.el.classList.add('dragging');
    c.el.style.top = r.top + 'px';
    applyOut(c);
  }

  function endDrag() {
    const c = drag.card;
    const y = parseFloat(c.el.style.top) || topMin();
    c.el.classList.remove('dragging');
    drag = null;
    applyOut(c);
    resolveDrop(c, y);
  }

  document.addEventListener('mousemove', (e) => {
    if (drag) {
      drag.card.el.style.top = e.clientY - drag.offsetY + 'px';
      return;
    }
    if (down && Math.abs(e.screenY - down.y) > 6) {
      startDrag(down.c, e);
      return;
    }
    setCapture(!!(e.target.closest('.card') || e.target.closest('#ctrl')));
  });

  document.addEventListener('mouseup', () => {
    if (drag) endDrag();
    else if (down) {
      // 알림 카드를 클릭하면 알림이 해소되면서 카드가 바로 안으로 들어간다
      if (down.c.state && down.c.state.alert) down.c.suppressHover = true;
      window.api.focus(down.c.el.dataset.cwd);
    }
    down = null;
  });

  document.documentElement.addEventListener('mouseleave', () => {
    if (drag) endDrag();
    setCapture(false);
  });

  window.api.onState((state) => {
    const list = state.cards || [];
    // 슬라이더를 막 움직인 직후에는 전송 중이던 옛 값이 덮지 않게 한다
    if (Date.now() - opTouchedAt > 2000) {
      opacity = state.opacity || 1;
      opSlider.value = String(Math.round(opacity * 100));
      applyGlobalOpacity();
    }

    const seen = new Set();
    const fresh = [];
    for (const s of list) {
      seen.add(s.cwd);
      let c = cards.get(s.cwd);
      let isNew = false;
      if (!c) {
        c = makeCard(s.cwd);
        cards.set(s.cwd, c);
        document.body.appendChild(c.el);
        isNew = true;
      }
      const hadAlert = !!(c.state && c.state.alert);
      c.state = s;
      // 막 드랍해서 저장이 도는 중인 카드는 옛 y가 덮지 않게 잠시 보호한다
      if (s.y != null && Date.now() - c.movedAt > 2000) c.baseY = s.y;
      c.name.textContent = s.name || '';
      c.name.title = s.cwd + (s.origin ? '\n출처: ' + s.origin : '') + '\n클릭하면 해당 창이 열립니다';
      if (s.alert) {
        c.msg.textContent = s.message || '';
        c.msg.title = s.message || '';
        c.desc.textContent = s.desc || '';
        c.desc.title = s.desc || '';
        // 새 알림이나 1분 재알림이면(bump 변화) 바운스를 처음부터 다시 재생
        if (c.bump !== s.bump) {
          c.bump = s.bump;
          c.el.style.animation = 'none';
          void c.el.offsetWidth;
          c.el.style.animation = '';
        }
      } else {
        c.bump = '';
        // 해소 직후에는 펼친 채로 두고(settling), 텍스트 비우기와 접힘 거리
        // 재측정은 전환이 끝난 뒤 settle()이 한다. 전환 중의 낡은 폭으로
        // 바로 접으면 카드가 화면 밖으로 사라지는 문제가 있었다
        if (hadAlert) c.settling = true;
      }
      c.err.textContent = s.err || '';
      c.el.classList.toggle('alert', !!s.alert);
      c.el.classList.toggle('working', !!s.working);
      c.el.classList.toggle('waiting', !s.alert && !s.working);
      c.el.classList.toggle('input', s.kind === 'input');
      c.el.classList.toggle('done', s.kind === 'done');
      c.el.classList.toggle('target', !!s.target && !!s.alert);
      // 새 카드는 즉시 접힘 거리를 잰다 (첫 렌더에는 전환이 없어 최종 폭이다).
      // 기존 카드는 전환 중일 수 있으므로 settle()이 최종 폭으로 다시 잰다
      if (isNew) updatePeek(c);
      applyOut(c);
      applyOpacity(c);
      if (c.baseY == null) fresh.push(c);
    }
    for (const [cwd, c] of [...cards]) {
      if (!seen.has(cwd)) {
        if (drag && drag.card === c) {
          drag = null;
          c.el.classList.remove('dragging');
        }
        c.el.remove();
        cards.delete(cwd);
      }
    }
    // 위치가 없는 새 카드는 기존 카드들 아래 빈자리에 차례로 배치하고 저장한다
    if (fresh.length) {
      let bottom = topMin();
      for (const c of cards.values()) {
        if (c.baseY != null) bottom = Math.max(bottom, c.baseY + c.el.offsetHeight + GAP + 2);
      }
      const assigned = {};
      for (const c of fresh) {
        c.baseY = bottom;
        assigned[c.el.dataset.cwd] = bottom;
        bottom += c.el.offsetHeight + GAP + 2;
      }
      window.api.setY(assigned);
    }
    layout();
    // 전환이 끝난 뒤 최종 크기로 접힘 거리와 배치를 확정한다
    clearTimeout(settleTimer);
    settleTimer = setTimeout(settle, SETTLE_MS);
  });
</script>
</body>
</html>
