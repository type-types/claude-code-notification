<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    user-select: none;
    cursor: default;
  }
  #card {
    height: 100%;
    box-sizing: border-box;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.85);
    border: 1px solid rgba(0, 0, 0, 0.18);
    color: #1c1c1e;
    padding: 5px 10px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 5px;
    transition: background 0.25s, border-color 0.25s;
  }
  #card:hover {
    border-color: rgba(0, 0, 0, 0.45);
  }
  body.alert #card {
    background: rgba(255, 216, 140, 0.92);
    border-color: rgba(200, 130, 20, 0.8);
  }
  #name {
    font-size: 12px;
    font-weight: 600;
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #msg {
    display: none;
    font-size: 10px;
    line-height: 1.35;
    color: #5a3c00;
    overflow: hidden;
    word-break: break-all;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
  }
  body.alert #msg {
    display: -webkit-box;
  }
  #desc {
    display: none;
    font-size: 9.5px;
    line-height: 1.3;
    color: rgba(90, 60, 0, 0.65);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  body.alert #desc {
    display: block;
  }
  #desc:empty {
    display: none !important;
  }
  body.input-kind #card {
    background: rgba(190, 220, 255, 0.92);
    border-color: rgba(40, 100, 190, 0.7);
  }
  body.input-kind #msg {
    color: #123c6e;
  }
  #err {
    font-size: 10px;
    color: #a33000;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #err:empty {
    display: none;
  }
</style>
</head>
<body>
  <div id="card">
    <div id="name"></div>
    <div id="msg"></div>
    <div id="desc"></div>
    <div id="err"></div>
  </div>
<script>
  const nameEl = document.getElementById('name');
  const msgEl = document.getElementById('msg');
  const descEl = document.getElementById('desc');
  const errEl = document.getElementById('err');

  window.api.onState((s) => {
    nameEl.textContent = s.name || '';
    nameEl.title = s.name || '';
    msgEl.textContent = s.message || '';
    msgEl.title = (s.message || '') + '\n클릭하면 해당 VSC 창이 열립니다';
    descEl.textContent = s.desc || '';
    descEl.title = s.desc || '';
    document.body.classList.toggle('alert', !!s.alert);
    document.body.classList.toggle('input-kind', s.kind === 'input');
    errEl.textContent = s.err || '';
  });

  // 클릭이면 VSC 창 열기, 4px 이상 움직이면 드래그 이동
  let downAt = null;
  let dragging = false;

  document.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    downAt = { x: e.screenX, y: e.screenY };
    dragging = false;
  });

  document.addEventListener('mousemove', (e) => {
    if (!downAt || dragging) return;
    if (Math.abs(e.screenX - downAt.x) > 4 || Math.abs(e.screenY - downAt.y) > 4) {
      dragging = true;
      window.api.dragStart();
    }
  });

  document.addEventListener('mouseup', () => {
    if (!downAt) return;
    if (dragging) window.api.dragEnd();
    else window.api.focus();
    downAt = null;
    dragging = false;
  });

  window.addEventListener('blur', () => {
    if (dragging) window.api.dragEnd();
    downAt = null;
    dragging = false;
  });

  document.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    window.api.menu();
  });
</script>
</body>
</html>
