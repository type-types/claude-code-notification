<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    user-select: none;
    cursor: default;
  }
  #card {
    height: 100%;
    box-sizing: border-box;
    border-radius: 10px;
    background: rgba(30, 30, 32, 0.82);
    border: 1px solid rgba(255, 255, 255, 0.10);
    color: #ececec;
    padding: 5px 10px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 5px;
    transition: background 0.25s, border-color 0.25s;
  }
  #card:hover {
    border-color: rgba(255, 255, 255, 0.35);
  }
  body.alert #card {
    background: rgba(146, 88, 12, 0.92);
    border-color: rgba(255, 190, 90, 0.75);
  }
  #name {
    font-size: 12px;
    font-weight: 600;
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #msg {
    display: none;
    font-size: 10px;
    line-height: 1.35;
    color: rgba(255, 235, 200, 0.95);
    overflow: hidden;
    word-break: break-all;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
  }
  body.alert #msg {
    display: -webkit-box;
  }
  #msg:hover {
    text-decoration: underline;
    cursor: pointer;
  }
  #desc {
    display: none;
    font-size: 9.5px;
    line-height: 1.3;
    color: rgba(255, 235, 200, 0.7);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  body.alert #desc {
    display: block;
  }
  #desc:empty {
    display: none !important;
  }
  #desc:hover {
    cursor: pointer;
  }
  #sub {
    display: none;
    align-items: center;
    gap: 6px;
    min-height: 20px;
  }
  body.alert #sub {
    display: flex;
  }
  #approve {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 12px;
    border-radius: 6px;
    border: 1px solid rgba(255, 255, 255, 0.25);
    background: rgba(255, 200, 90, 0.95);
    color: #402a00;
    cursor: pointer;
  }
  #approve:hover {
    background: #ffd888;
  }
  #approve:disabled {
    opacity: 0.55;
    cursor: default;
  }
  #spin {
    display: none;
    width: 11px;
    height: 11px;
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.35);
    border-top-color: #fff;
    animation: spin 0.8s linear infinite;
  }
  body.pending #spin {
    display: inline-block;
  }
  #err {
    font-size: 10px;
    color: #ffe2b0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body>
  <div id="card">
    <div id="name"></div>
    <div id="msg"></div>
    <div id="desc"></div>
    <div id="sub">
      <button id="approve">허용</button>
      <span id="spin"></span>
      <span id="err"></span>
    </div>
  </div>
<script>
  const nameEl = document.getElementById('name');
  const msgEl = document.getElementById('msg');
  const descEl = document.getElementById('desc');
  const approveEl = document.getElementById('approve');
  const errEl = document.getElementById('err');

  window.api.onState((s) => {
    nameEl.textContent = s.name || '';
    nameEl.title = s.name || '';
    msgEl.textContent = s.message || '';
    msgEl.title = (s.message || '') + '\n클릭하면 해당 VSC 창이 열립니다';
    descEl.textContent = s.desc || '';
    descEl.title = s.desc || '';
    document.body.classList.toggle('alert', !!s.alert);
    document.body.classList.toggle('pending', !!s.pending);
    approveEl.disabled = !!s.pending;
    errEl.textContent = s.err || '';
  });

  approveEl.addEventListener('click', (e) => {
    e.stopPropagation();
    window.api.approve();
  });

  // 클릭이면 VSC 창 열기, 4px 이상 움직이면 드래그 이동
  let downAt = null;
  let dragging = false;

  document.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    if (e.target.closest('#approve')) return;
    downAt = { x: e.screenX, y: e.screenY };
    dragging = false;
  });

  document.addEventListener('mousemove', (e) => {
    if (!downAt || dragging) return;
    if (Math.abs(e.screenX - downAt.x) > 4 || Math.abs(e.screenY - downAt.y) > 4) {
      dragging = true;
      window.api.dragStart();
    }
  });

  document.addEventListener('mouseup', () => {
    if (!downAt) return;
    if (dragging) window.api.dragEnd();
    else window.api.focus();
    downAt = null;
    dragging = false;
  });

  window.addEventListener('blur', () => {
    if (dragging) window.api.dragEnd();
    downAt = null;
    dragging = false;
  });

  document.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    window.api.menu();
  });
</script>
</body>
</html>
