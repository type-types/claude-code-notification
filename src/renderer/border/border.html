<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
    pointer-events: none;
  }
  #flash {
    position: fixed;
    inset: 0;
    opacity: 0;
    box-shadow: inset 0 0 90px 14px rgba(255, 171, 64, 0.55);
  }
  #flash.on {
    animation: pulse 0.75s ease-in-out 2;
  }
  #idle {
    position: fixed;
    inset: 0;
    opacity: 0;
    box-shadow: inset 0 0 34px 6px rgba(255, 171, 64, 0.18);
    transition: opacity 0.5s;
  }
  #idle.on {
    opacity: 1;
  }
  @keyframes pulse {
    0% { opacity: 0; }
    50% { opacity: 1; }
    100% { opacity: 0; }
  }
</style>
</head>
<body>
  <div id="flash"></div>
  <div id="idle"></div>
<script>
  const flashEl = document.getElementById('flash');
  const idleEl = document.getElementById('idle');

  window.api.onFlash(() => {
    flashEl.classList.remove('on');
    void flashEl.offsetWidth;
    flashEl.classList.add('on');
  });

  window.api.onIdle((on) => {
    idleEl.classList.toggle('on', !!on);
  });
</script>
</body>
</html>
